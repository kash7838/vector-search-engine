<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vector Search</title>
<style>
  :root {
    --bg:#eef1f4; --panel:#fff; --ink:#16212b; --muted:#5d6b78; --line:#cdd5dd;
    --accent:#0b6e6e; --accent-ink:#fff; --bad:#b3261e; --good:#1c6b3a; --drop:#e3f0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12181e; --panel:#1b242c; --ink:#e6ecf1; --muted:#93a1ae; --line:#34424e;
            --accent:#4fc3c3; --accent-ink:#06201f; --bad:#ff8a80; --good:#7fd69a; --drop:#173033; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font:600 28px/1.2 Georgia, "Times New Roman", serif; margin:0 0 4px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:20px; margin-bottom:20px; }
  h2 { font-size:17px; margin:0 0 12px; }
  #drop { border:2px dashed var(--line); border-radius:6px; padding:36px 16px; text-align:center; cursor:pointer; transition:background .15s,border-color .15s; }
  #drop.over { background:var(--drop); border-color:var(--accent); }
  #drop:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #drop strong { display:block; font-size:17px; }
  #drop span { color:var(--muted); font-size:14px; }
  #chosen { margin-top:12px; font-size:14px; min-height:21px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  button { font:inherit; font-weight:600; padding:9px 22px; border-radius:5px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .msg { margin-top:12px; font-size:14px; min-height:21px; }
  .msg.ok { color:var(--good); } .msg.err { color:var(--bad); }
  textarea { width:100%; min-height:84px; padding:10px; font:14px/1.4 Consolas, monospace; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:5px; resize:vertical; }
  label { font-size:14px; color:var(--muted); }
  input[type=number] { width:70px; padding:7px; font:inherit; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:5px; }
  table { width:100%; border-collapse:collapse; margin-top:14px; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); }
  th { font-weight:600; color:var(--muted); font-size:14px; }
  .bar { height:8px; background:var(--accent); border-radius:4px; min-width:2px; }
  #stats { color:var(--muted); font-size:14px; margin-top:10px; }
  @media (prefers-reduced-motion: reduce) { #drop { transition:none; } }
</style>
</head>
<body>
<main>
  <h1>Vector search</h1>
  <p class="sub">Load a CSV or JSON file of vectors, then find the most similar ones by cosine similarity.</p>

  <section>
    <h2>1. Load vectors</h2>
    <div id="drop" tabindex="0" role="button" aria-label="Choose or drop a CSV or JSON file">
      <strong>Drop a .csv or .json file here</strong>
      <span>or click to browse</span>
    </div>
    <input type="file" id="file" accept=".csv,.json,.tsv,.txt" hidden>
    <div id="chosen">No file selected.</div>
    <div class="row">
      <button id="ok" disabled>OK</button>
      <button id="clear" class="ghost" disabled>Clear</button>
    </div>
    <div id="uploadMsg" class="msg" role="status"></div>
  </section>

  <section>
    <h2>2. Search</h2>
    <label for="query">Query vector (numbers separated by commas or spaces). Leave empty to use vector #0 from your file.</label>
    <textarea id="query" placeholder="0.12, -0.5, 0.33, ..."></textarea>
    <div class="row">
      <label for="k">Results</label>
      <input type="number" id="k" value="5" min="1" max="1000">
      <button id="search" disabled>Search</button>
    </div>
    <div id="searchMsg" class="msg" role="status"></div>
    <div id="results"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let file = null;

function setMsg(el, text, kind) { el.textContent = text; el.className = 'msg ' + (kind || ''); }

function choose(f) {
  if (!f) return;
  if (!/\.(csv|json|tsv|txt)$/i.test(f.name)) { setMsg($('uploadMsg'), 'Only .csv and .json files are supported.', 'err'); return; }
  file = f;
  $('chosen').textContent = f.name + ' (' + (f.size / 1024).toFixed(1) + ' KB)';
  $('ok').disabled = false;
  $('clear').disabled = false;
  setMsg($('uploadMsg'), '');
}

function clearFile() {
  file = null; $('file').value = '';
  $('chosen').textContent = 'No file selected.';
  $('ok').disabled = true; $('clear').disabled = true;
}

const drop = $('drop');
drop.onclick = () => $('file').click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
$('file').onchange = e => choose(e.target.files[0]);
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => choose(e.dataTransfer.files[0]));
// Stop the browser from opening a file that misses the drop zone
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());
$('clear').onclick = () => { clearFile(); setMsg($('uploadMsg'), ''); };

$('ok').onclick = async () => {
  if (!file) return;
  $('ok').disabled = true;
  setMsg($('uploadMsg'), 'Uploading and indexing ' + file.name + '...');
  try {
    const r = await fetch('/upload?name=' + encodeURIComponent(file.name), { method: 'POST', body: file });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    setMsg($('uploadMsg'), 'Loaded ' + j.count.toLocaleString() + ' vectors with ' + j.dim + ' dimensions.', 'ok');
    $('search').disabled = false;
    $('results').innerHTML = '';
    clearFile();
  } catch (err) {
    setMsg($('uploadMsg'), err.message || 'Upload failed. Is the server running?', 'err');
    $('ok').disabled = false;
  }
};

$('search').onclick = async () => {
  const nums = $('query').value.split(/[\s,;\[\]]+/).filter(Boolean).map(Number);
  if (nums.some(Number.isNaN)) { setMsg($('searchMsg'), 'The query contains something that is not a number.', 'err'); return; }
  setMsg($('searchMsg'), 'Searching...');
  try {
    const r = await fetch('/search', { method: 'POST', body: JSON.stringify({ query: nums, k: +$('k').value || 5 }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    setMsg($('searchMsg'), '');
    const top = Math.max(...j.results.map(x => x.score), 0.0001);
    $('results').innerHTML =
      '<table><thead><tr><th>Rank</th><th>Vector ID</th><th>Score</th><th></th></tr></thead><tbody>' +
      j.results.map((x, i) => `<tr><td>${i + 1}</td><td>#${x.id}</td><td>${x.score.toFixed(4)}</td>` +
        `<td style="width:35%"><div class="bar" style="width:${Math.max(0, x.score / top * 100)}%"></div></td></tr>`).join('') +
      '</tbody></table><div id="stats">Compared against ' + j.scanned.toLocaleString() + ' vectors in ' +
      (j.latency_us / 1000).toFixed(2) + ' ms, using ' + j.used + '.</div>';
  } catch (err) {
    setMsg($('searchMsg'), err.message || 'Search failed.', 'err');
  }
};

fetch('/status').then(r => r.json()).then(s => {
  if (s.loaded) { $('search').disabled = false; setMsg($('uploadMsg'), 'A database is already loaded: ' + s.count.toLocaleString() + ' vectors, ' + s.dim + ' dimensions.', 'ok'); }
}).catch(() => {});
</script>
</body>
</html>
